name: Publish SearchEngine package

run-name: ${{ github.workflow }} / ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Опубликовать пакет в NuGet'
        required: true
        default: false
        type: boolean

  push:
    branches:
      - master
    tags:
      - 'searchengine-v*'
      - 'v*'

  pull_request:
    branches:
      - master

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            7.0.x
            8.0.x
            9.0.x
            10.0.x

      - name: Восстановить зависимости
        run: dotnet restore ./SearchEngine.sln

      - name: Собрать проект
        run: dotnet build ./SearchEngine.sln -c Release --no-restore

      - name: Запустить тесты
        run: dotnet test ./SearchEngine.sln -c Release --no-build

      - name: Собрать пакет
        run: dotnet pack ./src/SearchEngine/SearchEngine.csproj -c Release --no-build -o ./artifacts

      - name: Войти в NuGet по OIDC
        if: ${{ startsWith(github.ref, 'refs/tags/searchengine-v') || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Опубликовать пакет в NuGet
        if: ${{ startsWith(github.ref, 'refs/tags/searchengine-v') || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        run: |
          for package in ./artifacts/*.nupkg; do
            dotnet nuget push "$package" \
              --source "https://api.nuget.org/v3/index.json" \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
              --skip-duplicate
          done

      - name: Опубликовать символы в NuGet
        if: ${{ startsWith(github.ref, 'refs/tags/searchengine-v') || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        run: |
          for package in ./artifacts/*.snupkg; do
            [ -e "$package" ] || continue

            dotnet nuget push "$package" \
              --source "https://api.nuget.org/v3/index.json" \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
              --skip-duplicate
          done