name: Check SearchEngine service container

run-name: ${{ github.workflow }} / ${{ github.ref_name }}

on:
  workflow_dispatch:

  push:
    branches:
      - master
    tags:
      - 'service-v*'
    paths:
      - 'src/SearchEngine/**'
      - 'src/SearchEngine.Service/**'
      - '.dockerignore'
      - '.github/workflows/ci-searchengine-service-container.yml'

  pull_request:
    branches:
      - master
    paths:
      - 'src/SearchEngine/**'
      - 'src/SearchEngine.Service/**'
      - '.dockerignore'
      - '.github/workflows/ci-searchengine-service-container.yml'

permissions:
  contents: read
  packages: write

env:
  TEST_IMAGE: searchengine-service:test
  PUBLISH_IMAGE: ghcr.io/titeha/searchengine-service

jobs:
  check-container:
    runs-on: ubuntu-latest

    steps:
      - name: Получить код
        uses: actions/checkout@v5

      - name: Настроить Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Собрать Docker-образ сервиса
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/SearchEngine.Service/Dockerfile
          load: true
          tags: ${{ env.TEST_IMAGE }}

      - name: Запустить контейнер
        run: |
          docker run -d \
            --rm \
            --name searchengine-service-test \
            -p 8080:8080 \
            ${{ env.TEST_IMAGE }}

      - name: Проверить /health
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8080/health; then
              echo
              echo "Сервис ответил на /health."
              exit 0
            fi

            sleep 1
          done

          echo "Сервис не ответил на /health."
          docker logs searchengine-service-test
          exit 1

      - name: Остановить контейнер
        if: always()
        run: |
          docker stop searchengine-service-test || true

  publish-container:
    runs-on: ubuntu-latest
    needs:
      - check-container

    if: ${{ startsWith(github.ref, 'refs/tags/service-v') }}

    steps:
      - name: Получить код
        uses: actions/checkout@v5

      - name: Подготовить версию образа
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#service-v}"

          if [ -z "$version" ]; then
            echo "Не удалось определить версию контейнера."
            exit 1
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Настроить QEMU
        uses: docker/setup-qemu-action@v4

      - name: Настроить Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Войти в GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Собрать и опубликовать Docker-образ сервиса
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/SearchEngine.Service/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.PUBLISH_IMAGE }}:${{ steps.version.outputs.value }}
            ${{ env.PUBLISH_IMAGE }}:latest