name: Check SearchEngine service container

run-name: ${{ github.workflow }} / ${{ github.ref_name }}

on:
  workflow_dispatch:

  push:
    branches:
      - master
    tags:
      - 'service-v*'
    paths:
      - 'src/SearchEngine/**'
      - 'src/SearchEngine.Service/**'
      - 'Tests/**'
      - 'SearchEngine.sln'
      - '.dockerignore'
      - '.github/workflows/ci-searchengine-service-container.yml'

  pull_request:
    branches:
      - master
    paths:
      - 'src/SearchEngine/**'
      - 'src/SearchEngine.Service/**'
      - 'Tests/**'
      - 'SearchEngine.sln'
      - '.dockerignore'
      - '.github/workflows/ci-searchengine-service-container.yml'

permissions:
  contents: read
  packages: write

env:
  TEST_IMAGE: searchengine-service:test
  PUBLISH_IMAGE: ghcr.io/titeha/searchengine-service

jobs:
  check-container:
    runs-on: ubuntu-latest

    steps:
      - name: Получить код
        uses: actions/checkout@v5

      - name: Установить .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            6.0.x
            7.0.x
            8.0.x
            9.0.x
            10.0.x

      - name: Восстановить зависимости
        run: dotnet restore ./SearchEngine.sln

      - name: Собрать решение
        run: dotnet build ./SearchEngine.sln -c Release --no-restore

      - name: Запустить тесты
        run: dotnet test ./SearchEngine.sln -c Release --no-build

      - name: Настроить Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Собрать Docker-образ сервиса
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/SearchEngine.Service/Dockerfile
          load: true
          tags: ${{ env.TEST_IMAGE }}

      - name: Запустить контейнер
        run: |
          docker run -d \
            --rm \
            --name searchengine-service-test \
            -p 8080:8080 \
            --health-interval=5s \
            --health-timeout=3s \
            --health-start-period=5s \
            --health-retries=5 \
            ${{ env.TEST_IMAGE }}

      - name: Проверить /health
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8080/health; then
              echo
              echo "Сервис ответил на /health."
              exit 0
            fi

            sleep 1
          done

          echo "Сервис не ответил на /health."
          docker logs searchengine-service-test
          exit 1

      - name: Проверить Docker HEALTHCHECK
        run: |
          for i in {1..30}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' searchengine-service-test)"

            echo "Docker health status: $status"

            if [ "$status" = "healthy" ]; then
              echo "Контейнер помечен как healthy."
              exit 0
            fi

            if [ "$status" = "unhealthy" ]; then
              echo "Контейнер помечен как unhealthy."
              docker logs searchengine-service-test
              exit 1
            fi

            sleep 2
          done

          echo "Контейнер не перешёл в состояние healthy."
          docker inspect searchengine-service-test
          docker logs searchengine-service-test
          exit 1

      - name: Остановить контейнер
        if: always()
        run: |
          docker stop searchengine-service-test || true

  publish-container:
    runs-on: ubuntu-latest
    needs:
      - check-container

    if: ${{ startsWith(github.ref, 'refs/tags/service-v') }}

    steps:
      - name: Получить код
        uses: actions/checkout@v5

      - name: Подготовить версию образа
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#service-v}"

          if [ -z "$version" ]; then
            echo "Не удалось определить версию контейнера."
            exit 1
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Настроить QEMU
        uses: docker/setup-qemu-action@v4

      - name: Настроить Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Войти в GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Собрать и опубликовать Docker-образ сервиса
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/SearchEngine.Service/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.PUBLISH_IMAGE }}:${{ steps.version.outputs.value }}
            ${{ env.PUBLISH_IMAGE }}:latest